name: Deploy Vietsub Pro
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/vietsub-realtime/**"
      - "package.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vietsub-pro-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m py_compile apps/vietsub-realtime/main.py
      - run: docker build -t vietsub-realtime ./apps/vietsub-realtime
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx wrangler deploy --dry-run --config apps/api/wrangler.jsonc
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      - name: Deploy Worker and Container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/api/wrangler.jsonc
